appId: com.tuto-record.app
productName: tuto-record
directories:
  buildResources: build
files:
  # Allow-list: only these ship, plus the production node_modules electron-builder adds itself.
  - out/**
  - resources/**
  - package.json
  # Binaries for other architectures and platforms.
  - '!**/node_modules/@img/*-darwin-x64/**'
  - '!**/node_modules/@koromix/koffi-darwin-x64/**'
  - '!**/node_modules/uiohook-napi/prebuilds/{darwin-x64,linux-arm64,linux-loong64,linux-x64,win32-arm64,win32-x64}/**'
asarUnpack:
  - resources/**
  - '**/*.node'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/@koromix/**'
mac:
  target:
    - dir
    - dmg
  category: public.app-category.productivity
  hardenedRuntime: true
  electronLanguages:
    - en
  gatekeeperAssess: false
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
  format: UDBZ
npmRebuild: false
afterPack: build/adhocSign.cjs
