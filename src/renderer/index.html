<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tuto-Record</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: tuto-image:"
    />
    <link href="./assets/base.css" rel="stylesheet" />
    <link href="./assets/layout.css" rel="stylesheet" />
    <link href="./assets/sidebar.css" rel="stylesheet" />
    <link href="./assets/preview.css" rel="stylesheet" />
    <link href="./assets/recorder-bar.css" rel="stylesheet" />
  </head>

  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar">
        <header class="sidebar-header">
          <h2>Projects</h2>
          <button
            type="button"
            id="new-project"
            class="icon-button"
            title="New Project"
            aria-label="New Project"
          >
            +
          </button>
        </header>
        <ul id="tree" class="tree" role="tree" aria-label="Projects"></ul>
        <p id="sidebar-empty" class="sidebar-empty" hidden></p>
        <footer class="sidebar-footer">
          <button type="button" id="open-settings" class="settings-button" title="Settings (⌘,)">
            <span aria-hidden="true">⚙︎</span> Settings
          </button>
        </footer>
      </aside>

      <section id="pane" class="pane">
        <header class="pane-header">
          <h1 id="heading"></h1>
          <div class="pane-actions">
            <button type="button" id="open-tutorial" hidden>Open in Finder</button>
            <button type="button" id="header-action" class="primary" hidden></button>
          </div>
        </header>

        <div class="pane-body">
          <div id="notice" class="notice" hidden>
            <p id="notice-text"></p>
            <button type="button" id="notice-settings" class="primary">Open Settings</button>
          </div>

          <div id="placeholder" class="placeholder" hidden>
            <p>Select a Tutorial in the sidebar, or create one with +.</p>
          </div>

          <div id="empty-state" class="empty-state" hidden>
            <h2>No screenshots yet</h2>
            <p>Start recording to add screenshots.</p>
            <button type="button" id="start" class="primary large"></button>
            <p class="hint">
              Each left click saves one screenshot per display. The window hides while recording.
              Stop with <strong>⌃⌥⌘R</strong> or by clicking the Dock icon.
            </p>
          </div>

          <div id="preview" class="preview" hidden>
            <div class="large-view">
              <img id="large-image" alt="" draggable="false" />
            </div>
            <div id="strip" class="strip" role="listbox" aria-label="Screenshots"></div>
          </div>
        </div>

        <footer class="pane-footer">
          <p id="status" class="status"></p>
          <p id="problem" class="problem" hidden></p>
          <p id="recorder-summary" class="summary" hidden></p>
          <p id="recorder-error" class="problem" hidden></p>
          <p id="shortcut-warning" class="problem" hidden></p>
        </footer>
      </section>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
